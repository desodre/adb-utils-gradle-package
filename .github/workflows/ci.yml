name: CI

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  main-build:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew clean assemble

  build:
    if: github.ref == 'refs/heads/dev'
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [17, 21]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew clean build

  publication-validation:
    if: github.ref == 'refs/heads/dev'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew checkKotlinAbi consumerTest
      - uses: actions/upload-artifact@v4
        with:
          name: publication-check-repository
          path: build/publication-check-repository

  samples:
    if: github.ref == 'refs/heads/dev'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: ./gradlew validatePublication
      - name: Build Kotlin/JVM sample
        run: ./gradlew -p samples/kotlin-jvm clean test -PadbUtilsRepository="$PWD/build/publication-check-repository" -PadbUtilsVersion="$(tr -d '[:space:]' < VERSION)"
      - name: Build Android sample
        run: ./gradlew -p samples/android clean assembleDebug -PadbUtilsRepository="$PWD/build/publication-check-repository" -PadbUtilsVersion="$(tr -d '[:space:]' < VERSION)"

  adb-integration:
    if: github.ref == 'refs/heads/dev'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api_level: [21, 35, '37.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run ADB integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.api_level == '37.0' && 'pixel' || '' }}
          ram-size: ${{ matrix.api_level == '37.0' && '3072M' || '' }}
          heap-size: ${{ matrix.api_level == '37.0' && '512M' || '' }}
          disk-size: ${{ matrix.api_level == '37.0' && '4096M' || '' }}
          emulator-options: ${{ matrix.api_level == '37.0' && '-no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -no-metrics' || '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim' }}
          disable-animations: true
          script: ./gradlew adbTest -PadbTest=true -PadbSerial=emulator-5554 -PadbTargetKind=emulator
      - name: Upload ADB test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adb-integration-report-api-${{ matrix.api_level }}
          path: |
            build/test-results/adbTest
            build/reports/tests/adbTest
          if-no-files-found: ignore

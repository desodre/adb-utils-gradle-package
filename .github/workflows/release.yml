name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and sign Central bundle
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew clean check consumerTest releaseBundle

      - name: Upload signed bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-utils-${{ steps.version.outputs.version }}-central-bundle
          path: build/central-bundle/adb-utils-${{ steps.version.outputs.version }}-central-bundle.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload and automatically publish on Maven Central
        id: central
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$CENTRAL_USERNAME"
          test -n "$CENTRAL_PASSWORD"
          authorization="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 --wrap=0)"
          echo "::add-mask::$authorization"
          bundle="build/central-bundle/adb-utils-$VERSION-central-bundle.zip"
          deployment_id="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            --form "bundle=@$bundle;type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=adb-utils-$VERSION&publishingType=AUTOMATIC")"
          [[ "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Maven Central publication
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ steps.central.outputs.deployment_id }}
        run: |
          set -euo pipefail
          authorization="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 --wrap=0)"
          echo "::add-mask::$authorization"
          for attempt in $(seq 1 60); do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $authorization" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID")"
            state="$(jq --raw-output '.deploymentState' <<< "$response")"
            echo "Maven Central deployment state: $state"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) jq . <<< "$response"; exit 1 ;;
              PENDING|VALIDATING|PUBLISHING) sleep 30 ;;
              *) echo "Unexpected deployment state: $state"; jq . <<< "$response"; exit 1 ;;
            esac
          done
          echo "Maven Central publication timed out"
          exit 1

      - name: Create GitHub release notes
        run: scripts/release-notes.sh "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/central-bundle/adb-utils-$VERSION-central-bundle.zip" \
            --verify-tag \
            --title "adb-utils $VERSION" \
            --notes-file release-notes.md
